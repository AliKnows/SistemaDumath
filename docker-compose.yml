services:
  frontend:
    build:
      context: ./sistem-Dumath-Front
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks: [dumath]
    restart: unless-stopped

  backend:
    build:
      context: ./SistemaPrubasBeta
    environment:
      APP_NAME: DUMATH
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8001}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-dumath}
      DB_USERNAME: ${DB_USERNAME:-dumath}
      DB_PASSWORD: ${DB_PASSWORD:-dumath_password}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    networks: [dumath]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dumath}
      MYSQL_USER: ${DB_USERNAME:-dumath}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dumath_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [dumath]
    restart: unless-stopped

  adminer:
    image: adminer:4
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks: [dumath]
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  dumath:
    driver: bridge
